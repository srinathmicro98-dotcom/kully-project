<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kully</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="login-screen">
  <form id="login-form">
    <h1>Kully</h1>
    <input id="login-username" placeholder="Username" autocomplete="username" />
    <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" />
    <button type="submit">Sign in</button>
    <p id="login-error" class="error" hidden>Invalid username or password.</p>
  </form>
</div>

<div id="app" hidden>
  <header>
    <h1>Kully</h1>
    <input id="serverUrl" placeholder="Server URL (e.g. https://kully-cofounder.duckdns.org)" />
    <button id="signOut" type="button">Sign out</button>
  </header>
  <main id="messages"></main>
  <form id="composer">
    <input id="input" placeholder="Message Kully..." autocomplete="off" />
    <button type="submit">Send</button>
  </form>
</div>
<script src="app.js"></script>
</body>
</html>
