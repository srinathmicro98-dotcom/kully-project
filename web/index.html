<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kully</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#0f1115" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Kully" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="login-screen">
  <form id="login-form">
    <h1>Kully</h1>
    <input id="login-username" placeholder="Username" autocomplete="username" />
    <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" />
    <button type="submit">Sign in</button>
    <p id="login-error" class="error" hidden>Invalid username or password.</p>
  </form>
</div>

<div id="app" hidden>
  <header>
    <h1>Kully</h1>
    <div class="controls">
      <button id="connectBtn" type="button">Connect</button>
      <button id="disconnectBtn" type="button" hidden>Disconnect</button>
      <button id="signOutBtn" type="button">Sign out</button>
    </div>
  </header>
  <p id="banner" hidden></p>
  <main id="messages"></main>
  <form id="composer">
    <input id="input" placeholder="Message Kully..." autocomplete="off" disabled />
    <button type="submit" disabled>Send</button>
  </form>
</div>
<script src="app.js"></script>
</body>
</html>
