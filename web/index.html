<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kully</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <header>
    <h1>Kully</h1>
    <input id="serverUrl" placeholder="Server URL (e.g. https://kully-cofounder.duckdns.org)" />
  </header>
  <main id="messages"></main>
  <form id="composer">
    <input id="input" placeholder="Message Kully..." autocomplete="off" />

  </form>
</div>
<script src="app.js"></script>
</body>
</html>
