<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kully</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#0f1115" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Kully" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="login-screen">
  <form id="login-form">
    <h1>Kully</h1>
    <input id="login-username" placeholder="Username" autocomplete="username" />
    <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" />
    <button type="submit">Sign in</button>
    <p id="login-error" class="error" hidden>Invalid username or password.</p>
  </form>
</div>

<div id="app" hidden>
  <header>
    <button id="historyBtn" type="button" class="icon-btn" title="History">☰</button>
    <h1>Kully</h1>
    <input id="projectInput" class="project-input" placeholder="project" title="Current project — scopes memory and the sandbox workspace" />
    <div class="controls">
      <button id="notifyBtn" type="button" class="ghost-btn" title="Notify me when ready">🔔</button>
      <button id="projectsBtn" type="button" class="ghost-btn" title="Projects">Projects</button>
      <button id="skillsBtn" type="button" class="ghost-btn" title="Skills">Skills</button>
      <button id="connectBtn" type="button">Connect</button>
      <button id="disconnectBtn" type="button" hidden>Disconnect</button>
      <button id="signOutBtn" type="button">Sign out</button>
    </div>
  </header>
  <p id="banner" hidden></p>
  <main id="messages"></main>
  <form id="composer">
    <input id="input" placeholder="Message Kully..." autocomplete="off" disabled />
    <button type="submit" disabled>Send</button>
  </form>

  <div id="historyPanel" class="panel" hidden>
    <div class="panel-header">
      <h2>History</h2>
      <button type="button" class="newChatBtn">+ New chat</button>
      <button type="button" class="closePanelBtn">✕</button>
    </div>
    <div class="panel-body" id="historyList"></div>
  </div>

  <div id="projectsPanel" class="panel" hidden>
    <div class="panel-header">
      <h2>Projects</h2>
      <button type="button" class="closePanelBtn">✕</button>
    </div>
    <div class="panel-body">
      <h3 class="panel-section-title">Your projects <span class="dim">— tap one to switch to it</span></h3>
      <div id="projectsList"></div>
      <h3 class="panel-section-title">Memory for <span id="memoryProjectName" class="dim"></span></h3>
      <div id="projectFactsList"></div>
    </div>
  </div>

  <div id="skillsPanel" class="panel" hidden>
    <div class="panel-header">
      <h2>Skills</h2>
      <button type="button" class="closePanelBtn">✕</button>
    </div>
    <div class="panel-body">
      <h3 class="panel-section-title">Agent prompts</h3>
      <div id="skillsList"></div>
      <h3 class="panel-section-title">Skills library <span class="dim">— invokable by the dev agent</span></h3>
      <div id="skillsLibraryList"></div>
      <button type="button" id="newSkillBtn" class="ghost-btn">+ New skill</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
